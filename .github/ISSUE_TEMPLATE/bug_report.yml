name: Bug report / 错误报告
description: Report a reproducible TaskDeck problem without sharing private task data.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve TaskDeck. Do not attach real databases, JSON exports, credentials, or screenshots containing private tasks. Use the private security channel for sensitive reports.
  - type: input
    id: version
    attributes:
      label: TaskDeck version / TaskDeck 版本
      placeholder: "2.0.0 (Build 13)"
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac model / macOS 版本与机型
      placeholder: "macOS 15.x, Apple Silicon"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps / 复现步骤
      description: Use synthetic task names and remove personal information.
      placeholder: |
        1. Create a sample task...
        2. Click...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior / 预期行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior / 实际行为
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check / 隐私确认
      options:
        - label: I removed task data, credentials, email addresses, and other personal information from this report.
          required: true
