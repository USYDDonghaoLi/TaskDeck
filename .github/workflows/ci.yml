name: TaskDeck CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: taskdeck-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, test, and privacy checks
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Inspect toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Check repository privacy
        run: zsh scripts/check_repository_privacy.sh

      - name: Run logic checks
        run: zsh scripts/check_logic.sh

      - name: Run PDF report checks
        run: zsh scripts/check_pdf_report.sh

      - name: Run Xcode tests
        run: |
          xcodebuild \
            -project TaskDeck.xcodeproj \
            -scheme TaskDeck \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            test
